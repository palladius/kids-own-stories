            - "No degrau mais alto do pódio, ao lado do seu fiel pônei branco, Sebi ergueu a grande Taça de Ouro dos Campeões sob uma chuva de confetes brilhantes."
            - "O irmão mais velho Ale correu logo até o pódio para bater um toca-aqui cheio de orgulho, enquanto todos os cavalos gigantes faziam uma reverência ao pequeno campeão."
