            - "Sur la plus haute marche du podium, à côté de son fidèle poney blanc, Sebi souleva la grande Coupe d'Or des Champions sous une pluie de confettis."
            - "Son grand frère Ale courut aussitôt près du podium pour lui taper dans la main avec un immense sourire, tandis que les grands chevaux s'inclinaient avec admiration."
