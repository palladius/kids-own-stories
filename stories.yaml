            - "Sotto di loro l'acqua dell'Ogliastra brillava di mille sfumature di smeraldo, mentre sullo sfondo una grande barca a vela bianca dondolava placida davanti alle montagne verdi della Sardegna."
            - "Con la mano alzata in un grande saluto, Ale, Seby, Papà Riccardo, Mamma Kate e Nonna Lucilla hanno chiuso nel cuore ogni onda, ogni risata e ogni abbraccio di questo viaggio indimenticabile: arrivederci Sardegna, torneremo presto!"
          paragraphs_en:
            - "Before heading home, the three sea explorers—Daddy Riccardo with his blue goggles around his neck, and Alessandro and Sebastian with their snorkel masks—climbed onto the golden granite rocks of Arbatax's secret coves."
            - "Below them, the water of Ogliastra shimmered in a thousand shades of emerald, while in the background a white sailboat glided peacefully across the bay in front of the green Sardinian hills."
            - "Raising a hand in a big joyful wave, Ale, Seby, Daddy Riccardo, Mummy Kate, and Grandma Lucilla tucked every wave, every laugh, and every hug of this unforgettable trip safely into their hearts: goodbye Sardinia, we will be back soon!"
          paragraphs_fr:
            - "Avant le retour, les trois explorateurs des mers — Papa Riccardo avec ses lunettes bleues autour du cou, Alessandro et Sebastian avec leurs masques de plongée — ont grimpé sur les rochers de granit doré des criques d'Arbatax."
            - "En dessous d'eux, l'eau de l'Ogliastra scintillait de mille nuances d'émeraude, tandis qu'un grand voilier blanc glissait doucement devant les collines vertes de la Sardaigne."
            - "Avec un grand salut joyeux de la main, Ale, Seby, Papa Riccardo, Maman Kate et Mamie Lucilla ont gardé dans leur cœur chaque sourire de ce voyage inoubliable : au revoir la Sardaigne !"
          paragraphs_de:
            - "Vor der Heimreise kletterten die drei Meeresforscher — Papa Riccardo mit seiner blauen Schwimmbrille, Alessandro und Sebastian mit ihren Schnorchelmasken — auf die goldenen Granitfelsen der Buchten von Arbatax."
            - "Unter ihnen schimmerte das Wasser der Ogliastra in tausend Smaragdtönen, während im Hintergrund ein weißes Segelboot ruhig vor den grünen Hügeln Sardiniens dahinglitt."
            - "Mit einem fröhlichen Winken schlossen Ale, Seby, Papa Riccardo, Mama Kate und Oma Lucilla jede Welle und jedes Lachen dieser unvergesslichen Reise tief in ihr Herz: Auf Wiedersehen, Sardinien!"
          paragraphs_pt:
            - "Antes de voltar para casa, os três exploradores do mar — Papai Riccardo com seus óculos azuis no pescoço, Alessandro e Sebastian com suas máscaras de snorkel — subiram nos rochedos dourados de granito das enseadas de Arbatax."
            - "Abaixo deles, a água de Ogliastra brilhava em mil tons de esmeralda, enquanto ao fundo um lindo veleiro branco navegava tranquilo diante das montanhas verdes da Sardenha."
            - "Com a mão erguida num grande aceno alegre, Ale, Seby, Papai Riccardo, Mamãe Kate e Vovó Lucilla guardaram no coração cada onda, cada risada e cada abraço desta viagem inesquecível: até breve, Sardenha!"
