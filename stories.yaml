            - "Juste sous l'arc-en-ciel apparut une merveilleuse surprise : un Pupurabbu géant, le doux lapin en peluche violet aux longues oreilles lavande, devenu grand comme un nuage !"
            - "Pupurabbu serra Sebi dans un immense câlin tout doux en disant : « Wow, Sebi, tu es grand ! » tandis que son grand frère Ale dansait joyeusement sous les lumières en s'écriant : « Fini ! »"
          paragraphs_de:
