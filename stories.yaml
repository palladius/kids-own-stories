            - "Auf der obersten Stufe des Siegerpodests hob Sebi neben seinem treuen weißen Pony den großen goldenen Siegerpokal in den Himmel, während glitzerndes Konfetti herabregnete."
            - "Sein großer Bruder Ale lief sofort zum Podest, um mit ihm stolz abzuklatschen, während sich alle großen Pferde ehrfürchtig vor dem kleinen Champion verneigten."
          paragraphs_pt:
