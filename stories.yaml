            - "Pupurabbu strinse Sebi in un abbraccio morbidissimo e gli disse: «Wow, Sebi, sei grande!» mentre il fratello maggiore Ale ballava felice sotto le luci della disco party ed esclamava sorridendo: «Finito!»"
