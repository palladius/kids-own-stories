            - "Sebi, mit seinen dunkelblonden Haaren unter dem Reithelm und den strahlend himmelblauen Augen, saß auf seinem flinken weißen Pony: Er war so stark und mutig, dass er direkt neben den riesiggroßen Turnierpferden an den Start ging!"
            - "„Los Sebi, du bist der Schnellste und Mutigste von allen!“, feuerte Ale ihn begeistert an, als die Startglocke läutete."
          paragraphs_pt:
