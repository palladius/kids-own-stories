      pages:
        - page: 1
          title: "La Chiave nello Zaino e la Porta sul Banco"
          title_en: "The Key in the Backpack and the Door on the Desk"
          title_fr: "La Clé dans le Sac à Dos et la Porte sur le Pupitre"
          title_de: "Der Schlüssel im Rucksack und die Tür auf dem Schulpult"
          title_pt: "A Chave na Mochila e a Porta na Carteira da Escola"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena1_banco_porta.jpg
          summary: "Un ragazzo trova una chiave magica nello zaino e il giorno dopo scopre una porticina luminosa sul suo banco di scuola."
          paragraphs_it:
            - "C'era una volta un ragazzo curioso — uno di quei tipi sempre a caccia di misteri, di cui però nessuno ricordava mai il nome — che un pomeriggio trovò uno zaino straordinario. Sembrava un normale zaino di scuola, ma ad aprirlo riservava una sorpresa incredibile: nascosta proprio sul fondo di velluto brillava un'antica chiave d'oro massiccio, incisa con strani simboli luminosi."
            - "Emozionatissimo, il ragazzo corse a casa e passò tutta la sera a cercare una serratura che potesse andare bene. Provò nella porta d'ingresso, negli armadi del corridoio, nei cassetti della cucina e persino nei vecchi bauli in soffitta, ma non poté trovare nessuna parte dove entrare con quella chiave: ogni buco della serratura era o troppo grande o troppo piccolo!"
            - "Il giorno dopo (prossimo giornata), il ragazzo portò lo zaino a scuola tenendo la chiave in tasca. Quando suonò la campanella della seconda ricreazione (all'altro break), accadde il prodigio: appena poggiò la chiave sul legno del suo banco (sul suo desk), il piano iniziò a brillare d'oro e fece comparire una magica porticina segreta!"
          paragraphs_en:
            - "Once upon a time, there was a curious boy—whose name nobody could ever quite remember—who stumbled upon an extraordinary backpack. At first glance it looked like an ordinary school bag, but when he unzipped it, he found an incredible surprise resting at the bottom: an ancient golden key carved with mysterious glowing symbols."
            - "Thrilled by his discovery, the boy ran home and spent the entire evening searching for a matching lock. He tried the front door, the hallway wardrobes, the kitchen drawers, and even the dusty chests in the attic, but he couldn't find anywhere at all that the key would fit!"
            - "The very next day at school, during the second recess (the other break), something truly magical happened: as soon as he set the key down on his wooden desk, the wood began to shimmer with golden light, revealing a tiny, glowing secret door right on his desk!"
          paragraphs_fr:
            - "Il était une fois un garçon très curieux — dont personne ne parvenait jamais à se rappeler le prénom — qui trouva un après-midi un sac à dos extraordinaire. À première vue, il ressemblait à un simple sac d'école, mais tout au fond brillait une ancienne clé en or massif gravée de symboles lumineux."
            - "Fou de joie, le garçon courut chez lui et passa toute la soirée à chercher une serrure correspondante. Il essaya la porte d'entrée, les armoires du couloir, les tiroirs de la cuisine et même les vieux coffres du grenier, mais aucune serrure ne correspondait à cette clé !"
            - "Le lendemain à l'école, pendant la deuxième récréation, un prodige se produisit : dès qu'il posa la clé sur le bois de son pupitre, le bureau se mit à scintiller d'une lumière dorée et fit apparaître une petite porte secrète magique !"
          paragraphs_de:
            - "Es war einmal ein neugieriger Junge — an dessen Namen sich seltsamerweise niemand erinnern konnte —, der eines Nachmittags einen außergewöhnlichen Rucksack fand. Auf den ersten Blick sah er wie ein normaler Schulranzen aus, doch ganz unten auf dem Boden funkelte ein uralter goldener Schlüssel mit leuchtenden Symbolen."
            - "Voller Aufregung lief der Junge nach Hause und suchte den ganzen Abend nach einem passenden Schloss. Er probierte die Haustür, die Kleiderschränke im Flur, die Küchenschubladen und sogar die alten Truhen auf dem Dachboden aus, doch nirgendwo wollte der Schlüssel passen!"
            - "Am nächsten Tag in der Schule geschah in der zweiten großen Pause das Wunder: Kaum legte er den Schlüssel auf sein hölzernes Schulpult, begann das Holz golden zu schimmern und enthüllte eine kleine, leuchtende Geheimtür direkt auf seinem Pult!"
          paragraphs_pt:
            - "Era uma vez um menino muito curioso — cujo nome ninguém conseguia lembrar — que certa tarde encontrou uma mochila extraordinária. Parecia uma mochila escolar comum, mas bem no fundo brilhava uma antiga chave de ouro maciço gravada com símbolos luminosos."
            - "Empolgado com a descoberta, o menino correu para casa e passou a noite inteira procurando uma fechadura que servisse. Tentou na porta da frente, nos armários do corredor, nas gavetas da cozinha e até nos baús antigos do sótão, mas não encontrou nenhum lugar onde aquela chave entrasse!"
            - "No dia seguinte na escola, durante o segundo recreio, aconteceu o prodígio: assim que ele apoiou a chave sobre a madeira da sua carteira, o tampo começou a brilhar em ouro e revelou uma portinha secreta mágica!"
        - page: 2
          title: "Nel Mondo Scintillante dei Draghi"
          title_en: "Inside the Sparkling World of Dragons"
          title_fr: "Dans le Monde Étincelant des Dragons"
          title_de: "In der Funkelnden Welt der Drachen"
          title_pt: "No Mundo Cintilante dos Dragões"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena2_mondo_gemme.jpg
          summary: "Attraversata la porta, entra nel Mondo dei Draghi fatto di gemme preziose e inizia a riempirsi le tasche."
          paragraphs_it:
            - "Con il cuore che batteva all'impazzata, il ragazzo infilò la chiave d'oro nella minuscola serratura sul banco. Clic! La porticina si spalancò emanando un bagliore arcobaleno e, in un battito di ciglia, il ragazzo ci entrò dentro, scivolando giù per un tunnel di luce che lo portò lontano dall'aula di scuola."
            - "Atterrò sul morbido pavimento del leggendario Mondo dei Draghi, un regno sotterraneo che toglieva il fiato perché era fatto interamente di gemme! Ovunque guardasse c'erano colonne di ametista viola, cascate di zaffiri azzurri, stalattiti di smeraldo verde e colline intere di rubini che brillavano come lanterne."
            - "Davanti a tutta quella ricchezza, il ragazzo si lasciò prendere dall'avidità. Senza chiedersi a chi appartenessero quelle meraviglie, spalancò il suo zaino e cominciò a prendere tantissime gemme a due mani, riempiendosi le tasche, il cappuccio e lo zaino fino all'orlo!"
          paragraphs_en:
            - "With his heart racing with excitement, the boy slipped the golden key into the miniature keyhole on his desk. Click! The little door swung open in a burst of rainbow light, and in the blink of an eye, the boy stepped right inside, sliding down a glowing tunnel far away from his school classroom."
            - "He landed softly inside the legendary World of Dragons, a breathtaking underground kingdom made entirely of precious gems! Everywhere he looked, there were towering pillars of purple amethyst, waterfalls of blue sapphires, emerald stalactites, and whole hills of glittering red rubies."
            - "Dazzled by such riches, the boy let greed get the better of him. Without stopping to wonder who owned all those wonders, he threw open his backpack and began grabbing gems with both hands, stuffing his pockets, his hoodie, and his bag to the brim!"
          paragraphs_fr:
            - "Le cœur battant la chamade, le garçon glissa la clé d'or dans la minuscule serrure du pupitre. Clic ! La petite porte s'ouvrit dans un éclat arc-en-ciel et, en un clin d'œil, le garçon y entra, glissant le long d'un tunnel de lumière loin de sa salle de classe."
            - "Il atterrit dans le légendaire Monde des Dragons, un royaume souterrain à couper le souffle car il était entièrement fait de pierres précieuses ! Partout s'élevaient des colonnes d'améthyste violette, des cascades de saphirs bleus, des stalactites d'émeraude et des collines de rubis."
            - "Ébloui par tant de richesses, le garçon se laissa gagner par la gourmandise. Sans se demander à qui appartenaient ces merveilles, il ouvrit grand son sac à dos et se mit à ramasser des gemmes à pleines mains, remplissant ses poches et son sac jusqu'au bord !"
          paragraphs_de:
            - "Mit klopfendem Herzen steckte der Junge den goldenen Schlüssel in das winzige Schlüsselloch auf seinem Pult. Klick! Die kleine Tür sprang in einem Regenbogenlicht auf, und im Handumdrehen schlüpfte der Junge hinein und rutschte durch einen Lichttunnel weit weg von seinem Klassenzimmer."
            - "Er landete sanft in der legendären Welt der Drachen, einem atemberaubenden unterirdischen Königreich, das komplett aus Edelsteinen bestand! Überall ragten Säulen aus violettem Amethyst, Wasserfälle aus blauen Saphiren, Smaragdstalaktiten und ganze Hügel aus funkelnden Rubinen empor."
            - "Geblendet von solchem Reichtum packte den Jungen die Habgier. Ohne zu fragen, wem all diese Schätze gehörten, riss er seinen Rucksack auf und stopfte sich mit beiden Händen Taschen, Kapuze und Rucksack randvoll mit Edelsteinen!"
          paragraphs_pt:
            - "Com o coração batendo forte, o menino colocou a chave dourada na minúscula fechadura da carteira. Clique! A portinha se abriu num clarão de arco-íris e, num piscar de olhos, o menino entrou por ela, escorregando por um túnel de luz para bem longe da sala de aula."
            - "Ele pousou suavemente no lendário Mundo dos Dragões, um reino subterrâneo de tirar o fôlego, feito inteirinho de pedras preciosas! Por todos os lados havia colunas de ametista roxa, cascatas de safiras azuis, estalactites de esmeralda e colinas inteiras de rubis reluzentes."
            - "Deslumbrado com tanta riqueza, o menino deixou a ganância falar mais alto. Sem perguntar a quem pertenciam aquelas maravilhas, abriu a mochila e começou a pegar pedras preciosas com as duas mãos, enchendo os bolsos, o capuz e a mochila até a boca!"
        - page: 3
          title: "«No, sono mie!» — Il Furore del Grande Drago"
          title_en: "“No, They Are Mine!” — The Great Dragon's Wrath"
          title_fr: "« Non, elles sont à moi ! » — La Colère du Grand Dragon"
          title_de: "„Nein, die gehören mir!“ — Der Zorn des Großen Drachen"
          title_pt: "“Não, são minhas!” — A Fúria do Grande Dragão"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena3_drago_fuoco.jpg
          summary: "Il grande drago reclama le sue gemme, arrostisce il ragazzo con una fiammata in stile cartoon, riprende gemme e chiave e vola via."
          paragraphs_it:
            - "All'improvviso la caverna tremò come un tamburo e, da dietro una montagna di rubini, si alzò in tutta la sua maestosità il Guardiano del tesoro: un grandissimo drago dalle scaglie rosse e dorate. Vedendo lo zaino stracolmo, il drago puntò gli occhi di brace sul ragazzo e tuonò: «No, tu non puoi prenderle, sono mie!»."
            - "Invece di chiedere scusa e restituire il maltolto, il ragazzo strinse forte le spalline dello zaino, fece un passo indietro e rispose con una faccia tosta incredibile: «No, ora sono mie!». Fu la goccia che fece traboccare il vaso!"
            - "Il grandissimo drago gonfiò il petto e... FWOOOOOOSH! Sputò una gigantesca fiammata da cartone animato che frisse il ragazzo in un istante e — GNAM! — se lo mangiò in un sol boccone! Poi, con grande cura, il drago si riprese tutte le sue gemme indietro, recuperò la chiave dorata caduta a terra e spiegò le ali verso il soffitto della caverna."
          paragraphs_en:
            - "Suddenly, the entire cavern rumbled like a drum, and from behind a mountain of rubies rose the majestic Guardian of the treasure: a gigantic dragon with gleaming red and gold scales. Spotting the overflowing backpack, the dragon fixed his fiery eyes on the boy and boomed: “No, you cannot take those, they are mine!”"
            - "Instead of apologizing and giving the treasure back, the boy clutched the straps of his backpack tightly, took a step back, and replied with unbelievable cheekiness: “No, now they are mine!” That was the final straw!"
            - "The colossal dragon puffed out his chest and... FWOOOOOOSH! He breathed a comical, cartoon-style blast of fire that fried the greedy boy on the spot and—GULP!—ate him up in a single bite! Then, very carefully, the dragon took all his precious gems back, picked up the golden key, and spread his mighty wings toward the cavern sky."
          paragraphs_fr:
            - "Soudain, la caverne trembla comme un tambour et, derrière une montagne de rubis, se dressa le majestueux Gardien du trésor : un immense dragon aux écailles rouges et dorées. Voyant le sac à dos débordant, le dragon lança d'une voix tonnante : « Non, tu ne peux pas les prendre, elles sont à moi ! »"
            - "Au lieu de s'excuser et de rendre le trésor, le garçon serra fort les bretelles de son sac, recula d'un pas et répondit avec un culot incroyable : « Non, maintenant elles sont à moi ! » Ce fut la goutte d'eau qui fit déborder le vase !"
            - "L'immense dragon gonfla sa poitrine et... FWOOOOOOSH ! Il cracha une grande flamme de dessin animé qui fit frire le garçon sur place et — MIAM ! — il l'avala d'une seule bouchée ! Puis, avec grand soin, le dragon reprit toutes ses gemmes, récupéra la clé d'or et déploya ses ailes vers le ciel."
          paragraphs_de:
            - "Plötzlich bebte die ganze Höhle wie eine Trommel, und hinter einem Berg aus Rubinen erhob sich der majestätische Wächter des Schatzes: ein riesiger Drache mit rot-goldenen Schuppen. Als er den prall gefüllten Rucksack sah, donnerte der Drache: „Nein, du darfst sie nicht nehmen, die gehören mir!“"
            - "Anstatt sich zu entschuldigen und die Edelsteine zurückzugeben, hielt der Junge die Träger seines Rucksacks fest und rief frech: „Nein, jetzt gehören sie mir!“ Das brachte das Fass zum Überlaufen!"
            - "Der riesige Drache holte tief Luft und... FWOOOOOOSH! Er spie eine lustige Cartoon-Feuerwolke, briet den gierigen Jungen im Nu knusprig und — SCHNAPP! — verspeiste ihn mit einem einzigen Happen! Danach nahm der Drache all seine Edelsteine und den goldenen Schlüssel wieder an sich und breitete seine Flügel aus."
          paragraphs_pt:
            - "De repente, a caverna tremeu como um tambor e, de trás de uma montanha de rubis, ergueu-se o majestoso Guardião do tesouro: um enorme dragão de escamas vermelhas e douradas. Vendo a mochila abarrotada, o dragão trovejou: “Não, você não pode pegá-las, elas são minhas!”"
            - "Em vez de pedir desculpas e devolver o tesouro, o menino apertou firme as alças da mochila, deu um passo para trás e respondeu com uma cara de pau incrível: “Não, agora são minhas!” Foi a gota d'água!"
            - "O enorme dragão estufou o peito e... FWOOOOOOSH! Soltou uma labareda de desenho animado que fritou o menino num instante e — NHAC! — o engoliu numa bocada só! Depois, com todo o cuidado, o dragão pegou todas as suas pedras preciosas de volta, recuperou a chave dourada e abriu as asas rumo ao céu."
        - page: 4
          title: "Il Grande Twist — I Migliori Amici del Drago sono i Puffins!"
          title_en: "The Big Twist — The Dragon's Best Friends Are Puffins!"
          title_fr: "La Grande Surprise — Les Meilleurs Amis du Dragon sont les Macareux !"
          title_de: "Die Große Überraschung — Die Besten Freunde des Drachen sind Papageientaucher!"
          title_pt: "A Grande Surpresa — Os Melhores Amigos do Dragão são os Puffins!"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena4_drago_e_puffins.jpg
          summary: "Il drago usa la chiave per raggiungere un mondo d'oro e cristalli dove ritrova i suoi migliori amici: le pulcinelle di mare (Puffins)!"
          paragraphs_it:
            - "Ma perché il grande drago ci teneva così tanto a quella piccola chiave e alle sue gemme scintillanti? Ecco il segreto più bello della storia: quella chiave non serviva a chiudere una prigione, ma ad aprire il portale del cielo verso un altro mondo meraviglioso, fatto tutto d'oro e di cristalli fluttuanti tra le nuvole!"
            - "Appena il drago aprì il passaggio celeste e volò tra le torri dorate, una folla festosa gli corse incontro per abbracciarlo. E chi erano questi suoi amici? Erano forse altri draghi giganti e sputafuoco? «No, erano PUFFINS!»"
            - "Proprio così: i migliori amici del drago erano uno stormo di simpaticissime pulcinelle di mare dal becco arancione e dagli occhialoni da aviatore! Il gigante buono aveva difeso le gemme e la chiave proprio per poter tornare a volare e far festa nel mondo d'oro e cristalli insieme ai suoi adorati Puffins!"
          paragraphs_en:
            - "Wait a second—why did the great dragon care so much about that little key and his sparkling gems? Here is the best secret of the whole story: that key wasn't meant to lock a dungeon, but to unlock a sky portal leading to another wondrous world made entirely of gold and floating crystals!"
            - "As soon as the dragon unlocked the heavenly gateway and soared among the golden towers, a joyful crowd rushed out to greet him. And who were these friends of his? Were they other giant, fire-breathing dragons? “No, they were PUFFINS!”"
            - "That's right: the mighty dragon's best friends in the universe were a cheerful flock of sea puffins wearing little aviator goggles! The gentle giant had guarded the gems and the key so fiercely just so he could fly back and celebrate in the world of gold and crystals with his beloved Puffins!"
          paragraphs_fr:
            - "Mais pourquoi le grand dragon tenait-il tant à cette petite clé et à ses gemmes scintillantes ? Voici le plus beau secret de l'histoire : cette clé servait à ouvrir le portail céleste vers un autre monde merveilleux, entièrement fait d'or et de cristaux flottant dans les nuages !"
            - "Dès que le dragon ouvrit le passage céleste et s'envola parmi les tours dorées, une foule joyeuse courut à sa rencontre pour l'embrasser. Et qui étaient ses amis ? D'autres dragons géants cracheurs de feu ? « Non, c'étaient des PUFFINS ! »"
            - "Eh oui : les meilleurs amis du dragon étaient une joyeuse bande de macareux au bec orange portant de petites lunettes d'aviateur ! Le doux géant avait défendu ses gemmes et sa clé juste pour pouvoir retourner faire la fête dans le monde d'or et de cristaux avec ses adorables Puffins !"
          paragraphs_de:
            - "Aber warum waren dem großen Drachen dieser kleine Schlüssel und die funkelnden Edelsteine eigentlich so wichtig? Hier ist das schönste Geheimnis der Geschichte: Der Schlüssel öffnete ein Himmelsportal in eine andere wunderbare Welt, die ganz aus Gold und schwebenden Kristallen bestand!"
            - "Kaum hatte der Drache das Himmelstor aufgeschlossen und flog zwischen den goldenen Türmen hindurch, eilte ihm eine fröhliche Schar entgegen. Und wer waren diese Freunde? Etwa andere riesige Feuerdrachen? „Nein, es waren PUFFINS!“"
            - "Ganz genau: Die allerbesten Freunde des Drachen waren ein fröhlicher Schwarm kleiner Papageientaucher mit orangefarbenen Schnäbeln und Fliegerbrillen! Der sanfte Riese hatte die Edelsteine und den Schlüssel nur deshalb so tapfer beschützt, um mit seinen geliebten Puffins in der Welt aus Gold und Kristallen zu feiern!"
          paragraphs_pt:
            - "Mas por que o grande dragão se importava tanto com aquela chavinha e com suas pedras brilhantes? Aqui está o segredo mais lindo da história: aquela chave abria o portal do céu para outro mundo maravilhoso, feito todinho de ouro e cristais flutuantes entre as nuvens!"
            - "Assim que o dragão abriu a passagem celeste e voou entre as torres douradas, uma multidão festiva correu para abraçá-lo. E quem eram esses amigos dele? Eram outros dragões gigantes cuspindo fogo? “Não, eram PUFFINS!”"
            - "Isso mesmo: os melhores amigos do dragão eram um bando alegre de papagaios-do-mar de bico laranja usando óculos de aviador! O gigante gentil tinha protegido as gemas e a chave só para poder voltar a voar e festejar no mundo de ouro e cristais junto com seus adorados Puffins!"
    transcript:
      - speaker: "Papà Riccardo"
        text: "Ecco, ciao Ermete, buongiorno! Alessandro ha inventato una storia fighissima di uno zaino di una scuola... ti chiederei, adesso Ale te la racconta e quando ha finito tu usi il nuovo modello Gemini Omni... per fare un video di questa storia. Vai Ale!"
      - speaker: "Alessandro"
        text: "Una volta c'era un zaino... c'era un tizio che non mi ricordo com'era il suo nome, ma ha trovato un zaino e dentro il zaino ha trovato una chiave. E poi non ha potuto vedere nessuna parte dove entrare con quella chiave. Prossimo giornata all'altro break ha visto una porta sul suo desk e ci ha entrato ed è andato nel mondo dei draghi che era fatto di gemme! E poi lui ha preso tantissime gemme e poi c'è un drago, un grandissimo drago che ha detto: \"No, tu non puoi prenderle, sono mie!\" E il ragazzo ha detto: \"No, ora sono mie!\" E poi il drago ha sputato fuoco e l'ha fritto! E poi l'ha mangiato! E poi ha preso le gemme indietro e ha preso la chiave ed è andato con i suoi amici all'altro mondo fatto di oro e cristalli dove ha potuto vedere gli altri dei suoi amici."
      - speaker: "Papà Riccardo"
        text: "E cos'erano altri suoi amici? Erano altri draghi?"
      - speaker: "Alessandro"
        text: "No, erano PUFFINS!"
      - speaker: "Papà Riccardo"
        text: "Erano dei puffins?!"
      - speaker: "Alessandro"
        text: "Sì!"
      - speaker: "Papà Riccardo"
        text: "Quindi il drago era amico dei puffins?!"
      - speaker: "Alessandro"
        text: "Sì!"
      - speaker: "Papà Riccardo"
        text: "Ok, è finita la storia amore?"
      - speaker: "Alessandro"
        text: "Sì!"

