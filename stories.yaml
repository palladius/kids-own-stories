        - page: 1
          title: "La Libreria nel Buio Buio Giardino"
          title_en: "The Library in the Dark, Dark Garden"
          title_fr: "La Bibliothèque dans le Sombre, Très Sombre Jardin"
          title_de: "Die Bibliothek im Dunklen, Dunklen Garten"
          title_pt: "A Biblioteca no Jardim Escuro, Muito Escuro"
          image: stories/alessandro/storia-scheletri-zombie-te/scena1_giardino_libreria.jpg
          summary: "Una simpatica famiglia di scheletri col loro cane scheletro passeggia nel buio buio giardino e scopre una libreria piena di zombie educatissimi che chiedono un po' di tè."
          paragraphs_it:
            - "C'era una volta una simpatica famiglia di scheletri — papà, mamma e il piccolo scheletro — con tanto di fedelissimo cane scheletro che trottava allegro facendo tic-tac con le sue zampette d'osso. Una sera decisero di uscire insieme per una passeggiata speciale e andarono a esplorare il misterioso buio buio giardino."
            - "Laggiù tra le siepi antiche e gli alberi contorti c'era un buio buio intenso, così profondo che persino i grilli parlavano sottovoce. Ma proprio nel cuore del giardino, illuminata da lanterne calde e dorate, la famiglia scoprì una cosa straordinaria: una grandissima libreria di legno piena di volumi antichi!"
            - "E chi c'era dentro la libreria? C'erano tantissimi zombie zombie! Ma invece di fare versi spaventosi, quegli zombie avevano la gola secca dopo aver sfogliato tanti libri e, con un sorriso timido e un inchino, chiesero gentilmente agli scheletri se potessero avere un po' di tè caldo."
          paragraphs_en:
            - "Once upon a time, there was a friendly family of skeletons—Papa, Mama, and Little Skeleton—along with their loyal skeleton dog, who trotted happily with a cheerful click-clack of his bony paws. One evening, they decided to go out for a special stroll together into the mysterious dark, dark garden."
            - "Deep among the ancient hedges and twisting trees, there was an intense dark, dark night so thick that even the crickets whispered softly. Yet right in the heart of the garden, glowing under warm golden lanterns, the family discovered something extraordinary: a grand wooden library overflowing with books!"
            - "And who was inside that library? Lots and lots of zombie zombies! Instead of groaning or being scary, those book-loving zombies had dry throats from reading so many stories, and with a shy smile and a bow, they politely asked the skeletons for a little bit of warm tea."
          paragraphs_fr:
            - "Il était une fois une sympathique famille de squelettes — papa, maman et le petit squelette — accompagnée de leur fidèle chien squelette qui trottinait joyeusement en faisant clic-clac avec ses petites pattes d'os. Un soir, ils décidèrent d'aller se promener ensemble dans le mystérieux jardin sombre, très sombre."
            - "Là-bas, entre les haies anciennes et les arbres tordus, régnait une obscurité intense, si profonde que même les grillons chuchotaient. Mais en plein cœur du jardin, éclairée par de chaudes lanternes dorées, la famille découvrit une grande bibliothèque en bois remplie de livres anciens !"
            - "Et qui se trouvait dans la bibliothèque ? Tant et tant de zombies ! Mais au lieu de faire peur, ces zombies amoureux de lecture avaient la gorge sèche et, avec un sourire timide et une révérence, ils demandèrent très poliment aux squelettes s'ils pouvaient avoir un peu de thé chaud."
          paragraphs_de:
            - "Es war einmal eine freundliche Skelettfamilie — Papa, Mama und das kleine Skelett — zusammen mit ihrem treuen Skeletthund, der fröhlich mit seinen Knochenpfoten klack-klack machte. Eines Abends beschlossen sie, gemeinsam einen Spaziergang durch den geheimnisvollen dunklen, dunklen Garten zu unternehmen."
            - "Tief zwischen den alten Hecken herrschte eine tiefe, dichte Dunkelheit, in der sogar die Grillen nur flüsterten. Doch mitten im Herzen des Gartens, erhellt von warmen goldenen Laternen, entdeckte die Familie etwas Wunderbares: eine große hölzerne Bibliothek voller alter Bücher!"
            - "Und wer war in der Bibliothek? Lauter kleine Zombies! Aber anstatt gruselig zu sein, hatten diese lesefreudigen Zombies vom vielen Schmökern eine trockene Kehle und baten die Skelette mit einem höflichen Lächeln und einer Verbeugung um eine Tasse warmen Tee."
          paragraphs_pt:
            - "Era uma vez uma simpática família de esqueletos — papai, mamãe e o pequeno esqueleto — junto com seu fiel cachorrinho esqueleto, que trotava alegre fazendo tique-taque com suas patinhas de osso. Certa noite, decidiram sair juntos para um passeio especial pelo misterioso jardim escuro, muito escuro."
            - "Lá entre as cercas antigas havia uma escuridão intensa, tão profunda que até os grilos conversavam baixinho. Mas bem no coração do jardim, iluminada por lanternas douradas e acolhedoras, a família descobriu uma grande biblioteca de madeira cheia de livros antigos!"
            - "E quem estava dentro da biblioteca? Muitos e muitos zumbis! Mas, em vez de assustar alguém, aqueles zumbis leitores estavam com a garganta seca de tanto ler e, com um sorriso tímido e uma reverência, pediram gentilmente aos esqueletos um pouquinho de chá quente."
        - page: 2
          title: "Un Tè Fumante... e Poi Ancora di Più!"
          title_en: "Steaming Tea... and Even More!"
          title_fr: "Un Thé Fumant... et Encore Plus !"
          title_de: "Ein Dampfender Tee... und Noch Mehr!"
          title_pt: "Um Chá Fumegante... e Muito Mais!"
          image: stories/alessandro/storia-scheletri-zombie-te/scena2_primo_te.jpg
          summary: "Gli scheletri corrono a casa, preparano una teiera fumante e la portano agli zombie, che entusiasti ne vogliono ancora e ancora di più!"
          paragraphs_it:
            - "Sentendo una richiesta così educata, gli scheletri non persero un secondo: fecero dietrofront e tornarono di corsa a casa, con il cane scheletro che faceva strada scodinzolando nel buio. In cucina misero subito sul fuoco il bollitore e prepararono un tè profumatissimo alle erbe del giardino."
            - "Con la teiera fumante tra le mani, la famiglia di scheletri tornò nel buio buio giardino e servì il tè agli zombie con grande eleganza. Il vapore caldo profumava di miele, camomilla e cannella, scaldando l'aria fresca della notte."
            - "Appena gli zombie assaggiarono il primo sorso, i loro occhi si illuminarono di meraviglia: non avevano mai bevuto niente di così delizioso! Presi dall'entusiasmo, gli zombie ne vollero ancora di più, e poi ancora di più, finché nella teiera non rimase nemmeno una gocciolina!"
          paragraphs_en:
            - "Hearing such a polite request, the skeletons didn't waste a single second: they turned right around and hurried back home, with their skeleton dog leading the way through the dark. In their kitchen, they put the kettle on and brewed a wonderfully fragrant pot of herbal garden tea."
            - "Carrying a steaming teapot, the skeleton family returned to the dark, dark garden and served the tea to the zombies with great care. The warm steam smelled of honey, chamomile, and cinnamon, filling the cool night air."
            - "As soon as the zombies took their very first sip, their eyes lit up with wonder—they had never tasted anything so delicious! Bursting with excitement, the thirsty zombies wanted even more, and then even more after that, until not a single drop was left in the teapot!"
          paragraphs_fr:
            - "Touchés par une demande si polie, les squelettes ne perdirent pas une seconde : ils firent demi-tour et coururent jusqu'à la maison, guidés par leur chien squelette. Dans la cuisine, ils mirent aussitôt la bouilloire sur le feu et préparèrent un thé parfumé aux herbes du jardin."
            - "Tenant la théière fumante entre leurs mains, la famille de squelettes revint dans le jardin sombre et servit le thé aux zombies avec élégance. La vapeur chaude embaumait le miel, la camomille et la cannelle."
            - "Dès que les zombies goûtèrent la première gorgée, leurs yeux s'illuminèrent d'émerveillement : ils n'avaient jamais rien bu d'aussi délicieux ! Enthousiasmés, ils en voulurent encore plus, et toujours plus, jusqu'à la dernière goutte !"
          paragraphs_de:
            - "Nach einer so höflichen Bitte verloren die Skelette keine Sekunde: Sie eilten zurück nach Hause, während der Skeletthund schwanzwedelnd vorauslief. In der Küche setzten sie sofort den Wasserkessel auf und brühten einen herrlich duftenden Kräutertee."
            - "Mit der dampfenden Teekanne in den Händen kehrte die Skelettfamilie in den dunklen Garten zurück und schenkte den Zombies liebevoll ein. Der warme Dampf duftete nach Honig, Kamille und Zimt."
            - "Kaum hatten die Zombies den ersten Schluck probiert, leuchteten ihre Augen vor Begeisterung auf: So etwas Köstliches hatten sie noch nie getrunken! Voller Freude wollten sie immer mehr und noch mehr, bis kein einziger Tropfen mehr in der Kanne war!"
          paragraphs_pt:
            - "Ouvindo um pedido tão educado, os esqueletos não perderam um segundo: deram meia-volta e correram para casa, com o cachorrinho esqueleto abrindo caminho no escuro. Na cozinha, colocaram logo a chaleira no fogo e prepararam um chá perfumado com ervas do jardim."
            - "Com o bule fumegante nas mãos, a família de esqueletos voltou ao jardim escuro e serviu o chá aos zumbis com muita elegância. O vapor quentinho tinha aroma de mel, camomila e canela."
            - "Assim que os zumbis provaram o primeiro gole, seus olhos brilharam de encantamento: nunca tinham bebido nada tão delicioso! Empolgados, os zumbis quiseram mais e mais, até não sobrar nem uma gotinha no bule!"
        - page: 3
          title: "Due Bicchieri di Tè e un «Grazie!» di Cuore"
          title_en: "Two Glasses of Tea and a Heartfelt “Thank You!”"
          title_fr: "Deux Grands Verres de Thé et un « Merci ! » du Fond du Cœur"
          title_de: "Zwei Gläser Tee und ein Herzliches „Danke!“"
          title_pt: "Dois Copos de Chá e um “Obrigado!” de Coração"
          image: stories/alessandro/storia-scheletri-zombie-te/scena3_due_bicchieri_grazie.jpg
          summary: "Gli scheletri tornano a casa a prendere due grandi bicchieri di tè; gli zombie li bevono dicendo «Grazie!» e rispondono «Sì!» alla proposta di un'altra sorpresa."
          paragraphs_it:
            - "Vedendo i loro nuovi amici ancora assetati, gli scheletri sorrisero e tornarono di nuovo a casa a gambe levate! Questa volta, per essere sicuri che nessuno restasse a bocca asciutta, presero due grandi bicchieri trasparenti colmi fino all'orlo di tè caldo all'arancia e rosmarino."
            - "Riportati i due bicchieri davanti alla libreria illuminata, gli zombie li bevvero fino all'ultimo sorso con un lungo sospiro di felicità. Poi posarono i bicchieri sul vassoio, si fecero un piccolo inchino e dissero tutti insieme con sincera gratitudine: «Grazie!»."
            - "Ma la serata era appena cominciata! Gli scheletri, felici di essere degli ospiti così premurosi, si piegarono in avanti e chiesero con entusiasmo: «Vuoi un'altra cosa?». E tutti gli zombie della libreria risposero in un grande coro festoso: «Sì!», dando inizio alla più bella festa di mezzanotte del giardino!"
          paragraphs_en:
            - "Seeing that their new friends were still thirsty, the skeletons grinned and ran all the way back home a second time! This time, to make sure there was plenty for everyone, they brought back two tall glasses filled right to the brim with warm, fragrant spiced tea."
            - "Back in front of the glowing library, the zombies drank both glasses down to the last sip with a happy sigh. Then they set the glasses neatly on the tray, gave a polite little bow, and said together with heartfelt gratitude: “Thank you!”"
            - "Yet the evening was only just beginning! Delighted to be such welcoming hosts, the skeletons leaned in and asked eagerly: “Would you like something else?” And all the zombies in the library cheered back in a joyful chorus: “Yes!”—turning the dark garden into the liveliest midnight tea party ever!"
          paragraphs_fr:
            - "Voyant leurs nouveaux amis encore assoiffés, les squelettes sourirent et retournèrent en courant à la maison une deuxième fois ! Cette fois, ils rapportèrent deux grands verres remplis à ras bord de thé chaud à l'orange et au romarin."
            - "Devant la bibliothèque illuminée, les zombies burent les deux verres jusqu'à la dernière goutte avec un soupir de bonheur. Puis ils posèrent les verres sur le plateau, s'inclinèrent poliment et dirent tous ensemble avec gratitude : « Merci ! »"
            - "Mais la soirée ne faisait que commencer ! Les squelettes, ravis d'être des hôtes si attentionnés, demandèrent avec enthousiasme : « Voulez-vous autre chose ? » Et tous les zombies répondirent en chœur : « Oui ! », lançant la plus belle fête de minuit du jardin !"
          paragraphs_de:
            - "Als die Skelette sahen, dass ihre neuen Freunde immer noch durstig waren, lächelten sie und liefen ein zweites Mal nach Hause! Diesmal brachten sie zwei große, bis zum Rand gefüllte Gläser mit warmem Orangen-Rosmarin-Tee mit."
            - "Vor der leuchtenden Bibliothek tranken die Zombies beide Gläser bis zum letzten Schluck aus. Dann stellten sie die Gläser ordentlich aufs Tablett, verbeugten sich höflich und riefen gemeinsam voller Dankbarkeit: „Danke!“"
            - "Doch der Abend hatte gerade erst begonnen! Überglücklich fragten die gastfreundlichen Skelette: „Wollt ihr noch etwas anderes?“ Und alle Zombies in der Bibliothek jubelten im Chor: „Ja!“ — und feierten die schönste Mitternachtsteeparty im ganzen Garten!"
          paragraphs_pt:
            - "Vendo que seus novos amigos ainda estavam com sede, os esqueletos sorriram e correram de volta para casa pela segunda vez! Desta vez, trouxeram dois copos grandes cheios até a borda de chá quente com laranja e alecrim."
            - "Diante da biblioteca iluminada, os zumbis beberam os dois copos até o último gole com um suspiro de felicidade. Depois apoiaram os copos na bandeja, fizeram uma pequena reverência e disseram juntos com sincera gratidão: “Obrigado!”"
            - "Mas a noite estava só começando! Os esqueletos, felizes por serem anfitriões tão carinhosos, perguntaram com entusiasmo: “Querem mais alguma coisa?” E todos os zumbis responderam num grande coro festivo: “Sim!”, dando início à festa da meia-noite mais divertida do jardim!"
    transcript:
      - speaker: "Papà Riccardo"
        text: "Pux, mio figlio Alessandro ha una storia da raccontarti, una storia che si è inventato. Ti chiederei di ascoltare tutta la storia di Ale, poi dopo quando l'hai ascoltata la trascrivi... Vai Ale, raccontaci la storia numero due!"
      - speaker: "Alessandro"
        text: "Ehm... questa storia è di... dei scheletri, una famiglia di scheletri con un cane scheletro. Una volta hanno voluto andare nel buio buio giardino. Nel buio buio giardino c'era un buio buio..."
      - speaker: "Papà Riccardo"
        text: "...intenso..."
      - speaker: "Alessandro"
        text: "...intenso! E c'era ehm... un... un... una libreria! E dentro la libreria c'erano tantissimi zombie, zombie che hanno chiesto gentilmente per una... un po' di tè! E poi i scheletri hanno andato indietro a casa, ha preso un tè, e poi li ha dato a i zombie. I zombie ne ha voluto di più di tè, e più! E poi hanno andato..."
      - speaker: "Papà Riccardo"
        text: "Il tè intendi il tè da bere hanno voluto? Ok, hanno voluto più tè!"
      - speaker: "Alessandro"
        text: "Sì! E poi hanno andato a casa, questa volta hanno preso due bicchieri di tè. Poi i zombie li ha beve- bevuti e hanno chiesto: \"Grazie!\". E poi i scheletri hanno chiesto: \"Vuoi un'altra cosa?\". E poi i zombie hanno detto: \"Sì!\". Finita!"
