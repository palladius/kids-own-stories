            - "Genau unter dem Regenbogen erschien eine wunderbare Überraschung: ein riesengroßer Pupurabbu, der flauschige lila Plüschhase mit den langen lavendelfarbenen Ohren!"
            - "Der riesige Pupurabbu schloss Sebi in eine kuschelweiche Umarmung und sagte: „Wow, Sebi, du bist großartig!“, während Bruder Ale fröhlich unter den Discolichtern tanzte und lächelnd rief: „Fertig!“"
          paragraphs_pt:
            - "E como conta o irmão mais velho Ale com um toque de fantasia, na “end” da corrida começou uma festa extraordinária para Sebi: uma brilhante Disco Party com globo espelhado, coroada no céu por um arco-íris mágico — um verdadeiro “Rainbow, Regenbogen”!"
            - "Bem debaixo do arco-íris apareceu uma surpresa maravilhosa: um Pupurabbu grandíssimo, o fofo coelho de pelúcia roxo de longas orelhas lavanda, agora gigante como uma nuvem!"
            - "O Pupurabbu gigante deu um abraço super fofinho em Sebi e disse: “Uau, Sebi, você é grande!” enquanto o irmão Ale dançava feliz sob as luzes da discoteca e sorria dizendo: “Acabou!”"
    transcript:
