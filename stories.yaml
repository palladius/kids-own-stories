      pages:
        - page: 1
          title: "La Chiave nello Zaino e la Porta sul Banco"
          title_en: "The Key in the Backpack and the Door on the Desk"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena1_banco_porta.jpg
          summary: "Un ragazzo trova una chiave magica nello zaino e il giorno dopo scopre una porticina luminosa sul suo banco di scuola."
          paragraphs_it:
            - "C'era una volta un ragazzo curioso — uno di quei tipi sempre a caccia di misteri, di cui però nessuno ricordava mai il nome — che un pomeriggio trovò uno zaino straordinario. Sembrava un normale zaino di scuola, ma ad aprirlo riservava una sorpresa incredibile: nascosta proprio sul fondo di velluto brillava un'antica chiave d'oro massiccio, incisa con strani simboli luminosi."
            - "Emozionatissimo, il ragazzo corse a casa e passò tutta la sera a cercare una serratura che potesse andare bene. Provò nella porta d'ingresso, negli armadi del corridoio, nei cassetti della cucina e persino nei vecchi bauli in soffitta, ma non poté trovare nessuna parte dove entrare con quella chiave: ogni buco della serratura era o troppo grande o troppo piccolo!"
            - "Il giorno dopo (prossimo giornata), il ragazzo portò lo zaino a scuola tenendo la chiave in tasca. Quando suonò la campanella della seconda ricreazione (all'altro break), accadde il prodigio: appena poggiò la chiave sul legno del suo banco (sul suo desk), il piano iniziò a brillare d'oro e fece comparire una magica porticina segreta!"
          paragraphs_en:
            - "Once upon a time, there was a curious boy—whose name nobody could ever quite remember—who stumbled upon an extraordinary backpack. At first glance it looked like an ordinary school bag, but when he unzipped it, he found an incredible surprise resting at the bottom: an ancient golden key carved with mysterious glowing symbols."
            - "Thrilled by his discovery, the boy ran home and spent the entire evening searching for a matching lock. He tried the front door, the hallway wardrobes, the kitchen drawers, and even the dusty chests in the attic, but he couldn't find anywhere at all that the key would fit!"
            - "The very next day at school, during the second recess (the other break), something truly magical happened: as soon as he set the key down on his wooden desk, the wood began to shimmer with golden light, revealing a tiny, glowing secret door right on his desk!"
        - page: 2
          title: "Nel Mondo Scintillante dei Draghi"
          title_en: "Inside the Sparkling World of Dragons"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena2_mondo_gemme.jpg
          summary: "Attraversata la porta, entra nel Mondo dei Draghi fatto di gemme preziose e inizia a riempirsi le tasche."
          paragraphs_it:
            - "Con il cuore che batteva all'impazzata, il ragazzo infilò la chiave d'oro nella minuscola serratura sul banco. Clic! La porticina si spalancò emanando un bagliore arcobaleno e, in un battito di ciglia, il ragazzo ci entrò dentro, scivolando giù per un tunnel di luce che lo portò lontano dall'aula di scuola."
            - "Atterrò sul morbido pavimento del leggendario Mondo dei Draghi, un regno sotterraneo che toglieva il fiato perché era fatto interamente di gemme! Ovunque guardasse c'erano colonne di ametista viola, cascate di zaffiri azzurri, stalattiti di smeraldo verde e colline intere di rubini che brillavano come lanterne."
            - "Davanti a tutta quella ricchezza, il ragazzo si lasciò prendere dall'avidità. Senza chiedersi a chi appartenessero quelle meraviglie, spalancò il suo zaino e cominciò a prendere tantissime gemme a due mani, riempiendosi le tasche, il cappuccio e lo zaino fino all'orlo!"
          paragraphs_en:
            - "With his heart racing with excitement, the boy slipped the golden key into the miniature keyhole on his desk. Click! The little door swung open in a burst of rainbow light, and in the blink of an eye, the boy stepped right inside, sliding down a glowing tunnel far away from his school classroom."
            - "He landed softly inside the legendary World of Dragons, a breathtaking underground kingdom made entirely of precious gems! Everywhere he looked, there were towering pillars of purple amethyst, waterfalls of blue sapphires, emerald stalactites, and whole hills of glittering red rubies."
            - "Dazzled by such riches, the boy let greed get the better of him. Without stopping to wonder who owned all those wonders, he threw open his backpack and began grabbing gems with both hands, stuffing his pockets, his hoodie, and his bag to the brim!"
        - page: 3
          title: "«No, sono mie!» — Il Furore del Grande Drago"
          title_en: "“No, They Are Mine!” — The Great Dragon's Wrath"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena3_drago_fuoco.jpg
          summary: "Il grande drago reclama le sue gemme, arrostisce il ragazzo con una fiammata in stile cartoon, riprende gemme e chiave e vola via."
          paragraphs_it:
            - "All'improvviso la caverna tremò come un tamburo e, da dietro una montagna di rubini, si alzò in tutta la sua maestosità il Guardiano del tesoro: un grandissimo drago dalle scaglie rosse e dorate. Vedendo lo zaino stracolmo, il drago puntò gli occhi di brace sul ragazzo e tuonò: «No, tu non puoi prenderle, sono mie!»."
            - "Invece di chiedere scusa e restituire il maltolto, il ragazzo strinse forte le spalline dello zaino, fece un passo indietro e rispose con una faccia tosta incredibile: «No, ora sono mie!». Fu la goccia che fece traboccare il vaso!"
            - "Il grandissimo drago gonfiò il petto e... FWOOOOOOSH! Sputò una gigantesca fiammata da cartone animato che frisse il ragazzo in un istante e — GNAM! — se lo mangiò in un sol boccone! Poi, con grande cura, il drago si riprese tutte le sue gemme indietro, recuperò la chiave dorata caduta a terra e spiegò le ali verso il soffitto della caverna."
          paragraphs_en:
            - "Suddenly, the entire cavern rumbled like a drum, and from behind a mountain of rubies rose the majestic Guardian of the treasure: a gigantic dragon with gleaming red and gold scales. Spotting the overflowing backpack, the dragon fixed his fiery eyes on the boy and boomed: “No, you cannot take those, they are mine!”"
            - "Instead of apologizing and giving the treasure back, the boy clutched the straps of his backpack tightly, took a step back, and replied with unbelievable cheekiness: “No, now they are mine!” That was the final straw!"
            - "The colossal dragon puffed out his chest and... FWOOOOOOSH! He breathed a comical, cartoon-style blast of fire that fried the greedy boy on the spot and—GULP!—ate him up in a single bite! Then, very carefully, the dragon took all his precious gems back, picked up the golden key, and spread his mighty wings toward the cavern sky."
        - page: 4
          title: "Il Grande Twist — I Migliori Amici del Drago sono i Puffins!"
          title_en: "The Big Twist — The Dragon's Best Friends Are Puffins!"
          image: stories/alessandro/storia-dello-zaino-del-drago-e-dei-puffins/scena4_drago_e_puffins.jpg
          summary: "Il drago usa la chiave per raggiungere un mondo d'oro e cristalli dove ritrova i suoi migliori amici: le pulcinelle di mare (Puffins)!"
          paragraphs_it:
            - "Ma perché il grande drago ci teneva così tanto a quella piccola chiave e alle sue gemme scintillanti? Ecco il segreto più bello della storia: quella chiave non serviva a chiudere una prigione, ma ad aprire il portale del cielo verso un altro mondo meraviglioso, fatto tutto d'oro e di cristalli fluttuanti tra le nuvole!"
            - "Appena il drago aprì il passaggio celeste e volò tra le torri dorate, una folla festosa gli corse incontro per abbracciarlo. E chi erano questi suoi amici? Erano forse altri draghi giganti e sputafuoco? «No, erano PUFFINS!»"
            - "Proprio così: i migliori amici del drago erano uno stormo di simpaticissime pulcinelle di mare dal becco arancione e dagli occhialoni da aviatore! Il gigante buono aveva difeso le gemme e la chiave proprio per poter tornare a volare e far festa nel mondo d'oro e cristalli insieme ai suoi adorati Puffins!"
          paragraphs_en:
            - "Wait a second—why did the great dragon care so much about that little key and his sparkling gems? Here is the best secret of the whole story: that key wasn't meant to lock a dungeon, but to unlock a sky portal leading to another wondrous world made entirely of gold and floating crystals!"
            - "As soon as the dragon unlocked the heavenly gateway and soared among the golden towers, a joyful crowd rushed out to greet him. And who were these friends of his? Were they other giant, fire-breathing dragons? “No, they were PUFFINS!”"
            - "That's right: the mighty dragon's best friends in the universe were a cheerful flock of sea puffins wearing little aviator goggles! The gentle giant had guarded the gems and the key so fiercely just so he could fly back and celebrate in the world of gold and crystals with his beloved Puffins!"
    transcript:
      - speaker: "Papà Riccardo"
        text: "Ecco, ciao Ermete, buongiorno! Alessandro ha inventato una storia fighissima di uno zaino di una scuola... ti chiederei, adesso Ale te la racconta e quando ha finito tu usi il nuovo modello Gemini Omni... per fare un video di questa storia. Vai Ale!"
      - speaker: "Alessandro"
        text: "Una volta c'era un zaino... c'era un tizio che non mi ricordo com'era il suo nome, ma ha trovato un zaino e dentro il zaino ha trovato una chiave. E poi non ha potuto vedere nessuna parte dove entrare con quella chiave. Prossimo giornata all'altro break ha visto una porta sul suo desk e ci ha entrato ed è andato nel mondo dei draghi che era fatto di gemme! E poi lui ha preso tantissime gemme e poi c'è un drago, un grandissimo drago che ha detto: \"No, tu non puoi prenderle, sono mie!\" E il ragazzo ha detto: \"No, ora sono mie!\" E poi il drago ha sputato fuoco e l'ha fritto! E poi l'ha mangiato! E poi ha preso le gemme indietro e ha preso la chiave ed è andato con i suoi amici all'altro mondo fatto di oro e cristalli dove ha potuto vedere gli altri dei suoi amici."
      - speaker: "Papà Riccardo"
        text: "E cos'erano altri suoi amici? Erano altri draghi?"
      - speaker: "Alessandro"
        text: "No, erano PUFFINS!"
      - speaker: "Papà Riccardo"
        text: "Erano dei puffins?!"
      - speaker: "Alessandro"
        text: "Sì!"
      - speaker: "Papà Riccardo"
        text: "Quindi il drago era amico dei puffins?!"
      - speaker: "Alessandro"
        text: "Sì!"
      - speaker: "Papà Riccardo"
        text: "Ok, è finita la storia amore?"
      - speaker: "Alessandro"
        text: "Sì!"

