    quote: "«Volete un'altra cosa? — Sì!» — Alessandro C."
    transcript:
      - speaker: "Alessandro"
        text: "Questa storia parla di una famiglia di scheletri, con tanto di cane scheletro. Una volta hanno voluto andare nel buio buio giardino. Nel buio buio giardino c'era un buio buio intenso e c'era una libreria. E dentro la libreria c'erano tantissimi zombie zombie che hanno chiesto gentilmente un po' di tè. Allora gli scheletri sono tornati a casa, hanno preso un tè e lo hanno dato agli zombie. Gli zombie ne hanno voluto ancora di più, e poi ancora di più! Quindi gli scheletri sono tornati di nuovo a casa e questa volta hanno preso due bicchieri di tè. Gli zombie li hanno bevuti e hanno detto: \"Grazie!\". Poi gli scheletri hanno chiesto: \"Volete un'altra cosa?\". E gli zombie hanno risposto: \"Sì!\"."

